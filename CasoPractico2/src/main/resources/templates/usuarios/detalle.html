<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle Usuario</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Detalle de Usuario</h2>

    <p><strong>ID:</strong> <span th:text="${usuario.idUsuario}"></span></p>
    <p><strong>Nombre:</strong> <span th:text="${usuario.nombre}"></span></p>
    <p><strong>Apellidos:</strong> <span th:text="${usuario.apellidos}"></span></p>
    <p><strong>Correo:</strong> <span th:text="${usuario.correo}"></span></p>
    <p><strong>Username:</strong> <span th:text="${usuario.username}"></span></p>
    <p><strong>Rol:</strong> <span th:text="${usuario.rol.nombre}"></span></p>
    <p><strong>Activo:</strong> <span th:text="${usuario.activo}"></span></p>

    <a th:href="@{/usuarios/listado}">Volver</a>
</body>
</html>
