<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Listado de Usuarios</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Usuarios</h2>

    <a th:href="@{/usuarios/nuevo}">Nuevo Usuario</a> |
    <a th:href="@{/roles/listado}">Roles</a> |
    <a th:href="@{/eventos/listado}">Eventos</a> |
    <a th:href="@{/logout}">Cerrar sesión</a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Username</th>
                <th>Rol</th>
                <th>Activo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.idUsuario}"></td>
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.apellidos}"></td>
                <td th:text="${u.correo}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.rol.nombre}"></td>
                <td th:text="${u.activo}"></td>
                <td>
                    <a th:href="@{/usuarios/detalle/{id}(id=${u.idUsuario})}">Detalle</a>
                    <a th:href="@{/usuarios/modificar/{id}(id=${u.idUsuario})}">Editar</a>
                    <a th:href="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
