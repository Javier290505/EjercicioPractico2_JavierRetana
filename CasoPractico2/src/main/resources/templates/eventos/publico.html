<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Eventos Disponibles</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Eventos Disponibles</h2>

    <a th:href="@{/logout}">Cerrar sesión</a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Fecha</th>
                <th>Capacidad</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${eventos}">
                <td th:text="${e.nombre}"></td>
                <td th:text="${e.descripcion}"></td>
                <td th:text="${e.fecha}"></td>
                <td th:text="${e.capacidadMaxima}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
