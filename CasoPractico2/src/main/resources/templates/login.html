<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Iniciar Sesión</h2>

    <form th:action="@{/login}" method="post">
        <label>Usuario:</label>
        <input type="text" name="javier" required><br><br>

        <label>Contraseña:</label>
        <input type="password" name="1234" required><br><br>

        <button type="submit">Entrar</button>
    </form>

    <p th:if="${param.error}">Usuario o contraseña incorrectos</p>
    <p th:if="${param.logout}">Sesión cerrada correctamente</p>

    <a th:href="@{/registro}">Registrarse</a>
</body>
</html>
