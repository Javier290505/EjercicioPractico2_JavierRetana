<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Rol</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Formulario de Rol</h2>

    <form th:action="@{/roles/guardar}" th:object="${rol}" method="post">
        <input type="hidden" th:field="*{idRol}">

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required><br><br>

        <button type="submit">Guardar</button>
    </form>

    <a th:href="@{/roles/listado}">Volver</a>
</body>
</html>
